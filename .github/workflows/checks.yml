name: Game checks

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Python rules and HTTP tests
        run: python -m unittest discover -s tests -v
      - name: Browser application syntax
        run: node --check web/app.js
      - name: Audio, direction and UI lifecycle tests
        run: node --test --test-isolation=none tests/audio.test.cjs tests/theater.test.cjs tests/ui.test.cjs
      - name: Whitespace check
        run: git diff --check
