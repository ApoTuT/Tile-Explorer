name: Game checks

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'codex/**']
  pull_request:
    branches: [main, 'feat/**', 'codex/**']

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Project checks
        run: python tools/checks.py
